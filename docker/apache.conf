ServerName localhost
ServerTokens Prod
ServerSignature Off

<VirtualHost *:80>
    DocumentRoot /var/www/app/public

    <Directory /var/www/app/public>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        DirectoryIndex index.php
    </Directory>

    # Arquivos ocultos nunca são servidos.
    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>

    ErrorDocument 404 /404.php
    ErrorDocument 403 /404.php

    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set Referrer-Policy "same-origin"
    Header always set Cross-Origin-Opener-Policy "same-origin"
    Header always set Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=()"
    Header always set Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self'; script-src 'self'; font-src 'self'; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"

    # Fontes nunca mudam de conteúdo; o resto é revalidado a cada visita (304 barato),
    # assim uma atualização do site aparece sem precisar limpar o cache do navegador.
    ExpiresActive On
    ExpiresByType font/woff2 "access plus 1 year"
    <FilesMatch "\.(css|js|json|svg)$">
        Header set Cache-Control "no-cache"
    </FilesMatch>
    AddType font/woff2 .woff2

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
