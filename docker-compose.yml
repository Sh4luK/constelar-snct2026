# Constelar — PHP 8.3 (Apache) + MySQL.
# Subir: ./iniciar.sh   (ou: docker compose up -d)
services:
  db:
    # Padrão: MySQL 8.4. Em processadores antigos (sem SSE4.2) essa imagem não inicia;
    # nesse caso defina DB_IMAGE=mariadb:11.4 no .env (compatível com o projeto).
    image: ${DB_IMAGE:-mysql:8.4}
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-constelar}
      MYSQL_USER: ${DB_USER:-constelar}
      MYSQL_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD no .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?defina DB_ROOT_PASSWORD no .env}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          if command -v healthcheck.sh >/dev/null 2>&1;
          then healthcheck.sh --connect --innodb_initialized;
          else mysqladmin ping -h 127.0.0.1 -u"$$MYSQL_USER" -p"$$MYSQL_PASSWORD" --silent;
          fi
      interval: 5s
      timeout: 5s
      retries: 12
      # A primeira inicialização cria o banco e pode levar minutos em disco lento.
      start_period: 300s

  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    # Reconstrói a imagem a cada "up": o código de app/ vai dentro dela.
    pull_policy: build
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_NAME: ${DB_NAME:-constelar}
      DB_USER: ${DB_USER:-constelar}
      DB_PASSWORD: ${DB_PASSWORD}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?defina ADMIN_EMAIL no .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?defina ADMIN_PASSWORD no .env}
      CONTATO_EMAIL: ${CONTATO_EMAIL:-}
    volumes:
      - fotos_data:/var/www/dados/fotos
    ports:
      - "${APP_PORT:-8080}:80"

volumes:
  db_data:
  fotos_data:
